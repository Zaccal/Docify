name: Deploy Pipeline-Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test env through Bun
        run: bun run check-env
      - name: Build App
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          TEMPLATE_DIR: ${{ secrets.TEMPLATE_DIR }}
          EXCEL_SERVICE_URL: ${{ secrets.EXCEL_SERVICE_URL }}
      - uses: cypress-io/github-action@v7.4.3
        with:
          install: false
          start: bun run dev
          wait-on: 'http://localhost:3001'

  migrate:
    runs-on: ubuntu-latest
    environment: development
    needs: cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
