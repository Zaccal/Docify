name: Deploy Pipeline-Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      PASSWORD: ${{ secrets.PASSWORD }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      TEMPLATE_DIR: ${{ secrets.TEMPLATE_DIR }}
      EXCEL_SERVICE_URL: ${{ secrets.EXCEL_SERVICE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker-compose.ci.yml build

      - name: Start Docker services
        run: docker compose -f docker-compose.ci.yml up -d
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Cypress
        run: bun install --frozen-lockfile

      - name: Wait for application
        run: |
          timeout 120 bash -c \
            'until curl -f http://localhost:3001; do sleep 2; done'

      - name: Run Cypress
        uses: cypress-io/github-action@v7.4.3
        with:
          install: true
          wait-on: 'http://localhost:3001'

      - name: Show Docker logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  migrate:
    runs-on: ubuntu-latest
    environment: development
    needs: cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
