name: Deploy Pipeline-Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: development

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Docker images
        run: docker compose -f docker-compose.ci.yml build

      - name: Start PostgreSQL and Excel service
        run: docker compose -f docker-compose.ci.yml up -d postgres excel-service
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD }}

      - name: Wait for PostgreSQL
        run: |
          timeout 120 bash -c \
            'until docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U postgres -d Docify; do sleep 2; done'

      - name: Run database migrations
        working-directory: packages/db
        run: bun run db:migrate:file
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.PASSWORD }}@localhost:5433/Docify

      - name: Start web
        run: docker compose -f docker-compose.ci.yml up -d web
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

      - name: Wait for application
        run: |
          timeout 120 bash -c \
            'until curl -f http://localhost:3001; do sleep 2; done'

      - name: Run Cypress
        run: bunx cypress run --record
        env:
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cypress result summary
        if: always()
        run: |
          echo "## 🧪 Cypress E2E Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.cypress.outcome }}" = "success" ]; then
            echo "### ✅ Tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Tests failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cypress:** 15.21.1" >> "$GITHUB_STEP_SUMMARY"

      - name: Show Docker logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  migrate:
    runs-on: ubuntu-latest
    environment: development
    needs: cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
