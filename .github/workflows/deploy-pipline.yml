name: Deploy Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    environment: development

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Docker images
        run: docker compose -f docker-compose.ci.yml build

      - name: Start PostgreSQL and Excel service
        run: docker compose -f docker-compose.ci.yml up -d postgres excel-service
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD }}

      - name: Wait for PostgreSQL
        run: |
          timeout 120 bash -c \
            'until docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U postgres -d Docify; do sleep 2; done'

      - name: Run database migrations
        working-directory: packages/db
        run: bun run db:migrate:file
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.PASSWORD }}@localhost:5433/Docify

      - name: Start web
        run: docker compose -f docker-compose.ci.yml up -d web
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
          PASSWORD: ${{ secrets.PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

      - name: Wait for application
        run: |
          timeout 120 bash -c \
            'until curl -f http://localhost:3001; do sleep 2; done'

      - name: Run Cypress
        run: bunx cypress run --record
        env:
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Docker logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  lint:
    runs-on: ubuntu-latest
    needs: cypress
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint:github

  migrate:
    runs-on: ubuntu-latest
    environment: production
    needs: cypress
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - lint
      - migrate

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/adil/Docify
            git pull origin main
            docker compose up -d --build web excel-service nginx
            docker compose up -d --force-recreate nginx

            docker exec docify-nginx-1 nginx -t
            docker image prune -f
            docker builder prune -f
