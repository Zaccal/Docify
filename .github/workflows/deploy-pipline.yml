name: Deploy Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint:github

  cypress:
    name: Cypress E2E Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development

    needs:
      - unit-tests
      - lint

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      CYPRESS_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.ci.yml build --pull

      - name: Start PostgreSQL and Excel service
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          docker compose -f docker-compose.ci.yml \
            up -d postgres excel-service

      - name: Wait for PostgreSQL
        run: |
          timeout 120 bash -c '
            until docker compose -f docker-compose.ci.yml \
              exec -T postgres \
              pg_isready -U postgres -d Docify; do
              sleep 2
            done
          '

      - name: Run test database migrations
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.PASSWORD }}@localhost:5433/Docify
        run: bun run db:migrate:file

      - name: Start web application
        env:
          POSTGRES_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          docker compose -f docker-compose.ci.yml up -d web

      - name: Wait for application
        run: |
          timeout 120 bash -c '
            until curl --fail --silent http://localhost:3001; do
              sleep 2
            done
          '

      - name: Run Cypress
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx cypress run --record

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml \
            logs --tail=200

      - name: Cleanup Docker services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml \
            down -v --remove-orphans

  migrate:
    name: Production Database Migration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    needs:
      - unit-tests
      - lint
      - cypress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production migrations
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:migrate

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    needs:
      - migrate

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script: |
            set -eu

            cd /home/adil/Docify

            echo "Fetching deployment commit..."
            git fetch origin main
            git checkout main
            git reset --hard ${{ github.sha }}

            echo "Validating Docker Compose..."
            docker compose config --quiet

            echo "Building updated application images..."
            docker compose build --pull web excel-service

            echo "Pulling Nginx image..."
            docker compose pull nginx

            echo "Validating Nginx configuration..."
            docker compose run --rm --no-deps nginx nginx -t

            echo "Starting services..."
            docker compose up -d --no-build \
              web excel-service nginx

            echo "Checking container status..."
            docker compose ps

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Deployment completed."
